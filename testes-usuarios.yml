name: Testes do microservico de usuarios
on:
  push:
  pull_request:
jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usuarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm test
