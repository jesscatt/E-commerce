# Sobe tudo com: docker compose up --build
# A única porta da API é a 8080 (o gateway). Os serviços ficam só na rede interna do Docker.
name: ecommerce
services:

  # ---------- gateway (Kong sem banco) ----------
  gateway:
    image: kong:3.9
    ports:
      - "8080:8000"             # a API da loja: a única porta para o cliente
      - "127.0.0.1:8001:8001"   # Admin API (leitura), só na própria máquina
      - "127.0.0.1:8002:8002"   # Kong Manager, só na própria máquina
    volumes:
      - ./kong:/kong:ro
    # Troca __JWT_SECRET__ pelo valor real e sobe o Kong com o arquivo pronto.
    entrypoint:
      - sh
      - -c
      - sed "s|__JWT_SECRET__|$$JWT_SECRET|g" /kong/kong.yml > /tmp/kong.yml && exec /docker-entrypoint.sh kong docker-start
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: kong.plugins.jwt.jwt_parser
      JWT_SECRET: ${JWT_SECRET:-ecommerce-amf-segredo-jwt-de-desenvolvimento}
    depends_on:
      usuarios:
        condition: service_healthy
      catalogo:
        condition: service_healthy
      pedidos:
        condition: service_healthy
      pagamentos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- usuarios (Node + Postgres) ----------
  usuarios-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usuarios_db}
      POSTGRES_USER: ${POSTGRES_USER:-loja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loja-senha-dev}
    volumes:
      - usuarios_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  usuarios:
    build: ./usuarios
    environment:
      PORT: "3000"
      PGHOST: usuarios-db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-usuarios_db}
      PGUSER: ${POSTGRES_USER:-loja}
      PGPASSWORD: ${POSTGRES_PASSWORD:-loja-senha-dev}
      JWT_SECRET: ${JWT_SECRET:-ecommerce-amf-segredo-jwt-de-desenvolvimento}
    # sem "ports": só o gateway alcança o serviço
    depends_on:
      usuarios-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ---------- catalogo (Node + MongoDB) ----------
  catalogo-db:
    image: mongo:7
    volumes:
      - catalogo_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- redis (cache da vitrine do catálogo) ----------
  # Sem persistência: é cache. Se voltasse do disco, voltaria com preços velhos.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  catalogo:
    build: ./catalogo
    environment:
      PORT: "3000"
      MONGO_URL: mongodb://catalogo-db:27017
      MONGO_DB: catalogo
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SEGUNDOS: "60"
    # sem "ports": só o gateway (e o pedidos, pela rede interna) alcança o serviço
    depends_on:
      catalogo-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy   # só na subida; se o Redis cair depois, a vitrine continua (OFF)
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ---------- pedidos (Node + Postgres) ----------
  pedidos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pedidos_db
      POSTGRES_USER: ${POSTGRES_USER:-loja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loja-senha-dev}
    volumes:
      - pedidos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  pedidos:
    build: ./pedidos
    environment:
      PORT: "3000"
      PGHOST: pedidos-db
      PGPORT: "5432"
      PGDATABASE: pedidos_db
      PGUSER: ${POSTGRES_USER:-loja}
      PGPASSWORD: ${POSTGRES_PASSWORD:-loja-senha-dev}
      CATALOGO_URL: http://catalogo:3000
      CATALOGO_TIMEOUT_MS: "3000"
      KAFKA_BROKERS: kafka:9092
    # sem "ports": só o gateway alcança o serviço
    depends_on:
      pedidos-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ---------- pagamentos (Node + Postgres) ----------
  pagamentos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pagamentos_db
      POSTGRES_USER: ${POSTGRES_USER:-loja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loja-senha-dev}
    volumes:
      - pagamentos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  pagamentos:
    build: ./pagamentos
    environment:
      PORT: "3000"
      PGHOST: pagamentos-db
      PGPORT: "5432"
      PGDATABASE: pagamentos_db
      PGUSER: ${POSTGRES_USER:-loja}
      PGPASSWORD: ${POSTGRES_PASSWORD:-loja-senha-dev}
      KAFKA_BROKERS: kafka:9092
      BANCO_URL: http://banco-falso:3000
      BANCO_TIMEOUT_MS: "2000"
    # sem "ports": só o gateway alcança o serviço
    depends_on:
      pagamentos-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      banco-falso:
        condition: service_started
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ---------- banco-falso (o banco do cartão: sistema EXTERNO) ----------
  # Fora do Kong, com porta própria: ninguém de fora deveria chamar o banco pela loja.
  # Mude latência e falhas ao vivo: POST localhost:9000/config { "latenciaMs": 3000, "falhaPercent": 100 }
  banco-falso:
    build: ./banco-falso
    ports:
      - "9000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  kafka-storage:
    image: apache/kafka:3.8.0
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown 1000:1000 /data"]
    volumes:
      - kafka_data:/data
    restart: "no"

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    depends_on:
      kafka-storage:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.1.0
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ecommerce
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  notificacoes:
    build: ./notificacoes
    environment:
      KAFKA_BROKERS: kafka:9092
      PORT: "3000"   # só o /health, para o healthcheck; sem rota no Kong e sem porta publicada
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes:
      - notificacoes_data:/data
    depends_on:
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  usuarios_postgres_data:
  catalogo_mongo_data:
  pedidos_postgres_data:
  pagamentos_postgres_data:
  kafka_data:
  notificacoes_data:
