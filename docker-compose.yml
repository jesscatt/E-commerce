# Sobe tudo com: docker compose up --build
services:

  # ---------- catalogo (Node + MongoDB) ----------
  catalogo:
    build: ./catalogo
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGO_URL: mongodb://catalogo-db:27017
      MONGO_DB: catalogo
    depends_on:
      catalogo-db:
        condition: service_healthy
    restart: unless-stopped

  catalogo-db:
    image: mongo:7
    volumes:
      - catalogo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- usuarios (Node + Postgres) ----------
